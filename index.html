<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP UDEV - Secure Frequency Room</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
            --dim-color: #666666;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .credits {
            font-size: 0.85rem;
            color: var(--text-color);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .sub-credit {
            font-size: 0.75rem;
            color: var(--dim-color);
            letter-spacing: 1px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 0 15px var(--accent-glow);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .setup-screen, .room-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hidden {
            display: none !important;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            box-shadow: 0 0 8px var(--border-color);
        }

        .btn {
            background: #000;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .btn-danger:hover {
            background: #ff4444;
            color: #000;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            border-bottom: 1px dashed var(--dim-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .video-box {
            position: relative;
            background: #111;
            border: 1px solid var(--border-color);
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--dim-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .lock-indicator {
            color: #ff4444;
            font-weight: bold;
        }
        .lock-indicator.unlocked {
            color: #00ff66;
        }
    </style>
</head>
<body>

    <header>
        <h1>ESP UDEV</h1>
        <div class="credits">Made by Arhaan</div>
        <div class="sub-credit">All run on an ESP32</div>
    </header>

    <div class="container">
        <!-- SETUP & TUNER SCREEN -->
        <div id="setupScreen" class="setup-screen">
            <div class="input-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your callsign..." autocomplete="off">
            </div>
            <div class="input-group">
                <label for="freqInput">Frequency (MHz)</label>
                <input type="text" id="freqInput" placeholder="e.g. 201.04" autocomplete="off">
            </div>
            <button class="btn" id="tuneBtn">Tune In / Connect</button>
        </div>

        <!-- ACTIVE ROOM SCREEN -->
        <div id="roomScreen" class="room-screen hidden">
            <div class="status-bar">
                <div>Freq: <span id="currentFreq">---</span> MHz</div>
                <div>Status: <span id="roomStatus" class="lock-indicator unlocked">UNLOCKED</span></div>
            </div>

            <div class="video-grid">
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label" id="localLabel">YOU</div>
                </div>
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label" id="remoteLabel">PEER (WAITING)</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="toggleLockBtn">Lock Frequency</button>
                <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
            </div>
        </div>
    </div>

    <footer>
        Zero-Log &bull; P2P Encrypted &bull; Untraceable
    </footer>

    <script>
        const setupScreen = document.getElementById('setupScreen');
        const roomScreen = document.getElementById('roomScreen');
        const tuneBtn = document.getElementById('tuneBtn');
        const usernameInput = document.getElementById('usernameInput');
        const freqInput = document.getElementById('freqInput');
        
        const currentFreqDisplay = document.getElementById('currentFreq');
        const roomStatusDisplay = document.getElementById('roomStatus');
        const toggleLockBtn = document.getElementById('toggleLockBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const localLabel = document.getElementById('localLabel');

        let localStream = null;
        let isLocked = false;

        tuneBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const frequency = freqInput.value.trim();

            if (!username || !frequency) {
                alert('Please enter both a username and a valid numeric frequency (e.g., 201.04).');
                return;
            }

            try {
                // Request Camera & Mic permissions from iPad
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localLabel.textContent = username.toUpperCase();

                // Switch UI views
                currentFreqDisplay.textContent = frequency;
                setupScreen.classList.add('hidden');
                roomScreen.classList.remove('hidden');
            } catch (err) {
                alert('Camera/Microphone access was denied or is unavailable on this device.');
                console.error(err);
            }
        });

        toggleLockBtn.addEventListener('click', () => {
            isLocked = !isLocked;
            if (isLocked) {
                roomStatusDisplay.textContent = 'LOCKED (SECURE)';
                roomStatusDisplay.className = 'lock-indicator';
                toggleLockBtn.textContent = 'Unlock Frequency';
                toggleLockBtn.style.borderColor = '#ff4444';
            } else {
                roomStatusDisplay.textContent = 'UNLOCKED';
                roomStatusDisplay.className = 'lock-indicator unlocked';
                toggleLockBtn.textContent = 'Lock Frequency';
                toggleLockBtn.style.borderColor = '#ffffff';
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            roomScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            isLocked = false;
            roomStatusDisplay.textContent = 'UNLOCKED';
            roomStatusDisplay.className = 'lock-indicator unlocked';
            toggleLockBtn.textContent = 'Lock Frequency';
            toggleLockBtn.style.borderColor = '#ffffff';
        });
    </script>
</body>
</html>
